<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>PayPayごっこ - スマホアプリ</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 380px; margin: 0 auto; }
    
    /* PayPay風残高カード */
    .balance-card { background: linear-gradient(135deg, #ff0033, #ff4d4d); color: white; padding: 24px; border-radius: 18px; box-shadow: 0 6px 16px rgba(255, 0, 51, 0.25); margin-bottom: 20px; }
    .balance-title { font-size: 13px; opacity: 0.9; letter-spacing: 1px; }
    .balance-amount { font-size: 38px; font-weight: bold; margin: 8px 0; }
    .notice { font-size: 12px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; display: inline-block; }

    /* カメラとメッセージ */
    #reader { width: 100%; background: white; border-radius: 16px; overflow: hidden; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    #message { font-size: 16px; color: #ff0033; font-weight: bold; min-height: 24px; margin-bottom: 15px; }

    /* 履歴エリア */
    .history-card { background: white; padding: 18px; border-radius: 16px; text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .history-card h3 { margin-top: 0; font-size: 15px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 10px 0; border-bottom: 1px solid #f9f9f9; display: flex; justify-content: space-between; font-size: 14px; }
    .plus { color: #00875a; font-weight: bold; }
    .minus { color: #de350b; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">

  <!-- 残高表示 -->
  <div class="balance-card">
    <div class="balance-title">PayPay残高</div>
    <div class="balance-amount"><span id="balance">1000</span> 円</div>
    <div class="notice">※チャージは発券機（index.html）からスキャン</div>
  </div>

  <!-- 通知メッセージ -->
  <div id="message"></div>

  <!-- カメラエリア -->
  <div id="reader"></div>

  <!-- 履歴 -->
  <div class="history-card">
    <h3>取引履歴</h3>
    <ul id="history-list"></ul>
  </div>

</div>

<script>
  let currentBalance = 1000;
  let isProcessing = false;

  // Web Audio APIによる効果音
  function playPaySound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(1046.50, audioCtx.currentTime);
      gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start();
      osc1.stop(audioCtx.currentTime + 0.15);

      setTimeout(() => {
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1567.98, audioCtx.currentTime);
        gain2.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start();
        osc2.stop(audioCtx.currentTime + 0.3);
      }, 120);
    } catch(e) {}
  }

  function addHistory(title, amount, isPlus) {
    const list = document.getElementById('history-list');
    const li = document.createElement('li');
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const sign = isPlus ? "+" : "-";
    const className = isPlus ? "plus" : "minus";

    li.innerHTML = `
      <span>${time} ${title}</span>
      <span class="${className}">${sign}${amount}円</span>
    `;
    list.insertBefore(li, list.firstChild);
  }

  // QRスキャン判定処理
  function onScanSuccess(decodedText) {
    if (isProcessing) return;

    // --- チャージ処理 (CHARGE_金額) ---
    if (decodedText.startsWith("CHARGE_")) {
      let amount = parseInt(decodedText.replace("CHARGE_", ""));
      if (isNaN(amount) || amount <= 0) return;

      isProcessing = true;
      currentBalance += amount;
      document.getElementById('balance').innerText = currentBalance;
      document.getElementById('message').innerText = `💰 ${amount}円 チャージ完了！`;
      
      playPaySound();
      addHistory("チャージ", amount, true);

      setTimeout(() => {
        document.getElementById('message').innerText = "";
        isProcessing = false;
      }, 3000);
      return;
    }

    // --- 支払い処理 (PAY_金額) ---
    let payAmount = 0;
    let matches = decodedText.match(/\d+/);
    if (matches) {
      payAmount = parseInt(matches[0]);
    }

    if (payAmount <= 0) return;

    if (currentBalance >= payAmount) {
      isProcessing = true;
      currentBalance -= payAmount;
      
      document.getElementById('balance').innerText = currentBalance;
      document.getElementById('message').innerText = `「ペイペイ♪」 ${payAmount}円 支払いました！`;
      
      playPaySound();
      addHistory("店舗支払い", payAmount, false);

      setTimeout(() => {
        document.getElementById('message').innerText = "";
        isProcessing = false;
      }, 3000);

    } else {
      document.getElementById('message').innerText = "❌ 残高が足りません！";
    }
  }

  let html5QrcodeScanner = new Html5QrcodeScanner(
    "reader", { fps: 10, qrbox: 220 });
  html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>

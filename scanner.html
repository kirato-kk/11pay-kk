<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayPayごっこ - スキャナー & 履歴</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f6f9; margin: 0; }
    .container { max-width: 440px; margin: 0 auto; }
    .card { background: white; padding: 25px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 10px; }
    h1 { color: #333; font-size: 22px; margin-top: 0; margin-bottom: 15px; }
    
    .user-badge { background: #eef6ff; color: #007bff; padding: 8px 15px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    .balance-box { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 15px; }
    .balance-amount { color: #ff0033; font-size: 24px; }
    
    #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; }

    .main-btn { width: 100%; padding: 14px; font-size: 16px; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; background: #007bff; margin-top: 10px; }
    .secondary-btn { width: 100%; padding: 14px; font-size: 16px; color: #333; border: 1px solid #ccc; border-radius: 12px; cursor: pointer; font-weight: bold; background: #f8f9fa; margin-top: 10px; }
    
    .history-list { text-align: left; margin-top: 15px; max-height: 250px; overflow-y: auto; }
    .history-item { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .history-item .type-charge { color: #007bff; font-weight: bold; }
    .history-item .type-pay { color: #ff0033; font-weight: bold; }
    .history-item .date { font-size: 11px; color: #888; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>📱 読み取り & 決済</h1>
    
    <div class="user-badge" id="user-display">ログイン中: 未設定</div>
    <div class="balance-box">現在の残高: <span class="balance-amount" id="balance-display">0円</span></div>

    <div id="reader"></div>

    <button class="secondary-btn" onclick="toggleHistory()">📜 利用履歴を見る/隠す</button>

    <div id="history-area" class="history-list hidden">
      <div style="font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #555;">直近の取引履歴</div>
      <div id="history-items">履歴はありません</div>
    </div>
  </div>
</div>

<script>
  const currentUser = localStorage.getItem("paypay_login_user") || "ゲスト";
  document.getElementById("user-display").innerText = `ログイン中: ${currentUser}`;

  // 残高の読み込み・表示
  function getBalance() {
    return parseInt(localStorage.getItem(`balance_${currentUser}`) || "0");
  }

  function updateBalanceDisplay() {
    const balance = getBalance();
    document.getElementById("balance-display").innerText = `${balance.toLocaleString()}円`;
  }

  updateBalanceDisplay();

  // ★ Web Audio APIを使ったサウンド生成 ★
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // 「ブーブー」エラー音
  function playErrorSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const playBuzzer = (delay) => {
      setTimeout(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth'; // 濁った低い音
        osc.frequency.setValueAtTime(120, audioCtx.currentTime); // 120Hzの低音

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }, delay);
    };

    playBuzzer(0); // 1回目の「ブー」
    playBuzzer(300); // 2回目の「ブー」
  }

  // カメラ起動処理
  const html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 200, height: 200 } },
    onScanSuccess
  );

  function onScanSuccess(decodedText) {
    html5QrCode.stop();

    let type = "";
    let amount = 0;

    if (decodedText.startsWith("CHARGE_")) {
      type = "CHARGE";
      amount = parseInt(decodedText.replace("CHARGE_", ""));
    } else if (decodedText.startsWith("PAY_")) {
      type = "PAY";
      amount = parseInt(decodedText.replace("PAY_", ""));
    } else {
      alert("無効なQRコードです！");
      location.reload();
      return;
    }

    let currentBalance = getBalance();

    // ★ 残高不足の判定 ★
    if (type === "PAY" && currentBalance < amount) {
      playErrorSound();
      setTimeout(() => {
        alert(`❌ 残高不足です！\n必要額: ${amount.toLocaleString()}円\n現在の残高: ${currentBalance.toLocaleString()}円`);
        location.reload();
      }, 600);
      return;
    }

    // 残高更新処理
    if (type === "CHARGE") {
      currentBalance += amount;
    } else if (type === "PAY") {
      currentBalance -= amount;
    }

    localStorage.setItem(`balance_${currentUser}`, currentBalance);
    saveHistory(currentUser, type, amount);

    const label = type === "CHARGE" ? "チャージ" : "お支払い";
    alert(`【${label}完了】\n金額: ${amount.toLocaleString()}円\n新しい残高: ${currentBalance.toLocaleString()}円`);
    location.reload();
  }

  function saveHistory(user, type, amount) {
    const key = `history_${user}`;
    let history = JSON.parse(localStorage.getItem(key)) || [];

    const now = new Date();
    const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

    history.unshift({
      date: dateStr,
      type: type,
      amount: amount
    });

    localStorage.setItem(key, JSON.stringify(history));
  }

  function toggleHistory() {
    const area = document.getElementById("history-area");
    area.classList.toggle("hidden");

    if (!area.classList.contains("hidden")) {
      renderHistory();
    }
  }

  function renderHistory() {
    const key = `history_${currentUser}`;
    const history = JSON.parse(localStorage.getItem(key)) || [];
    const container = document.getElementById("history-items");

    if (history.length === 0) {
      container.innerHTML = "<div style='color:#999; font-size:13px;'>履歴はありません</div>";
      return;
    }

    container.innerHTML = history.map(item => `
      <div class="history-item">
        <div>
          <span class="${item.type === 'CHARGE' ? 'type-charge' : 'type-pay'}">
            ${item.type === 'CHARGE' ? '＋ チャージ' : '－ お支払い'}
          </span>
          <div class="date">${item.date}</div>
        </div>
        <div style="font-weight: bold; font-size: 16px;">
          ${item.amount.toLocaleString()}円
        </div>
      </div>
    `).join('');
  }
</script>

</body>
</html>

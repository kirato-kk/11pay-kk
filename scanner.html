<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11Pay - 送金・クーポン対応版</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 15px; background-color: #f4f6f9; margin: 0; }
    .container { max-width: 440px; margin: 0 auto; }
    
    .card-box { background: white; padding: 30px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 20px; }
    input { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #ddd; border-radius: 12px; margin-bottom: 12px; text-align: center; }
    .main-btn { width: 100%; padding: 16px; font-size: 18px; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; background: #ff0033; }
    .secondary-btn { width: 100%; padding: 12px; font-size: 15px; color: #666; border: 1px solid #ccc; border-radius: 12px; cursor: pointer; font-weight: bold; background: #fff; margin-top: 8px; }

    .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; margin-bottom: 10px; }
    .user-info { font-size: 18px; font-weight: bold; color: #333; display: flex; align-items: center; gap: 6px; }
    .logout-btn { background: #666; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .balance-card { background: linear-gradient(135deg, #ff0033, #ff4d4d); color: white; padding: 25px 20px; border-radius: 20px; box-shadow: 0 6px 18px rgba(255,0,51,0.3); margin-bottom: 20px; }
    .card-amount { font-size: 42px; font-weight: bold; }
    .point-display { margin-top: 10px; font-size: 16px; background: rgba(255, 255, 255, 0.2); padding: 6px 12px; border-radius: 20px; display: inline-block; }

    #reader { width: 100%; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px 20px; border-radius: 20px; width: 88%; max-width: 360px; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <!-- ログイン画面 -->
  <div id="login-view" class="card-box">
    <div style="font-size:28px; font-weight:bold; color:#ff0033;">11Pay ログイン</div>
    <input type="text" id="login-user" value="きらと">
    <input type="password" id="login-pass" value="1234">
    <button class="main-btn" onclick="login()">ログイン</button>
  </div>

  <!-- メイン画面 -->
  <div id="main-view" class="hidden">
    <div class="header">
      <div class="user-info">👤 <span id="user-display"></span></div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <div class="balance-card">
      <div style="opacity:0.9;">11Pay残高</div>
      <div class="card-amount"><span id="balance-display">1000</span> 円</div>
      <div class="point-display">🪙 <span id="point-display">0</span> pt</div>
    </div>
    <div id="reader"></div>
  </div>
</div>

<!-- 決済・送金確認モーダル -->
<div id="action-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3 id="modal-title">お支払い確認</h3>
    <p style="font-size:24px; font-weight:bold; color:#ff0033;" id="modal-amount">0 円</p>
    
    <div id="payment-options" style="text-align:left; font-size:14px;">
      <label><input type="checkbox" id="use-pt-check"> ポイントを使用</label><br>
      <select id="coupon-select" style="margin-top:10px; width:100%; padding:8px;">
        <option value="0">クーポンなし</option>
        <option value="100">100円引きクーポン</option>
        <option value="500">500円引きクーポン</option>
      </select>
    </div>
    <button class="main-btn" id="confirm-btn" onclick="executeAction()">確定</button>
    <button class="secondary-btn" onclick="location.reload()">キャンセル</button>
  </div>
</div>

<script>
  let currentUser = localStorage.getItem("paypay_login_user") || "";
  let balance = 1000, points = 0, currentAction = null, currentAmount = 0;

  // オーディオ
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if(type==='beep'){ osc.type='sine'; osc.frequency.setValueAtTime(880, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.1); osc.start(); osc.stop(now+0.1); }
    else if(type==='pay'){ osc.type='triangle'; osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now+0.1); gain.gain.exponentialRampToValueAtTime(0.001, now+0.3); osc.start(); osc.stop(now+0.3); }
  }

  function login() { 
    currentUser = document.getElementById("login-user").value;
    localStorage.setItem("paypay_login_user", currentUser);
    location.reload(); 
  }

  function logout() { localStorage.removeItem("paypay_login_user"); location.reload(); }

  window.onload = () => {
    if(currentUser){
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("main-view").classList.remove("hidden");
      document.getElementById("user-display").innerText = currentUser;
      balance = parseInt(localStorage.getItem(`bal_${currentUser}`)) || 1000;
      points = parseInt(localStorage.getItem(`pt_${currentUser}`)) || 0;
      updateDisplay();
      new Html5Qrcode("reader").start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScan);
    }
  };

  function updateDisplay(){
    document.getElementById("balance-display").innerText = balance.toLocaleString();
    document.getElementById("point-display").innerText = points.toLocaleString();
    localStorage.setItem(`bal_${currentUser}`, balance);
    localStorage.setItem(`pt_${currentUser}`, points);
  }

  function onScan(decodedText) {
    playSound('beep');
    // CHARGE_xxx, PAY_xxx, SEND_xxx
    const parts = decodedText.split('_');
    currentAction = parts[0];
    currentAmount = parseInt(parts[1]);

    if(currentAction === 'CHARGE') {
      balance += currentAmount;
      updateDisplay();
      alert(currentAmount + "円チャージしました！");
      location.reload();
    } else {
      document.getElementById("modal-title").innerText = (currentAction === 'SEND') ? "送金確認" : "お支払い確認";
      document.getElementById("modal-amount").innerText = currentAmount + " 円";
      document.getElementById("action-modal").classList.remove("hidden");
    }
  }

  function executeAction() {
    let finalAmount = currentAmount;
    
    // クーポン適用
    const discount = parseInt(document.getElementById("coupon-select").value);
    if(currentAction === 'PAY') finalAmount = Math.max(0, finalAmount - discount);

    // ポイント使用
    let usePt = document.getElementById("use-pt-check").checked ? Math.min(finalAmount, points) : 0;
    let cashPay = finalAmount - usePt;

    if(cashPay > balance) return alert("残高不足です");

    balance -= cashPay;
    points -= usePt;
    updateDisplay();
    playSound('pay');
    
    alert((currentAction === 'SEND' ? "送金" : "支払い") + "が完了しました！");
    location.reload();
  }
</script>
</body>
</html>

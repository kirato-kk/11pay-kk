<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>11Pay 修正版</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    .card { background: #eee; padding: 20px; border-radius: 10px; margin: 10px; }
    .btn { padding: 15px; background: red; color: white; border: none; border-radius: 5px; width: 100%; font-size: 18px; margin-top: 10px; }
    #qrcode { margin: 20px auto; width: 200px; height: 200px; }
    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:white; padding: 20px; display:none; }
  </style>
</head>
<body>

  <!-- メイン画面 -->
  <div id="main-ui">
    <div class="card">
      <h2>残高: <span id="balance">1000</span>円</h2>
      <p>ポイント: <span id="points">0</span> pt</p>
    </div>
    <button class="btn" onclick="openQRModal()">受取用QRを表示</button>
    <div id="reader" style="width: 100%; max-width: 400px; margin: 20px auto;"></div>
  </div>

  <!-- QR表示用モーダル -->
  <div id="qr-modal" class="modal">
    <input type="number" id="amt-input" placeholder="金額を入力">
    <button class="btn" onclick="makeQR()">QR生成</button>
    <div id="qrcode"></div>
    <button class="btn" style="background:#666;" onclick="closeModal()">閉じる</button>
  </div>

  <!-- 決済確認モーダル -->
  <div id="pay-modal" class="modal">
    <h2 id="pay-title">決済確認</h2>
    <h1 id="pay-amount">0円</h1>
    <div id="coupon-area" style="display:none;">
      <label>クーポン:</label>
      <select id="coupon-sel" onchange="calc()">
        <option value="0">なし</option>
        <option value="100">100円引き</option>
      </select>
    </div>
    <button class="btn" onclick="finish()">確定</button>
  </div>

<script>
  let bal = 1000, pts = 0, rawAmt = 0;

  // QR生成処理
  function makeQR() {
    const amt = document.getElementById("amt-input").value;
    const el = document.getElementById("qrcode");
    el.innerHTML = ""; // クリア
    new QRCode(el, { text: "PAY_TEST_" + amt, width: 200, height: 200 });
  }

  // スキャン処理
  new Html5Qrcode("reader").start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (data) => {
    // スキャンされたら決済モードへ
    rawAmt = parseInt(data.split('_')[2] || 500); 
    document.getElementById("pay-modal").style.display = "block";
    document.getElementById("coupon-area").style.display = "block"; // 強制表示
    calc();
  });

  // クーポン計算
  function calc() {
    const disc = parseInt(document.getElementById("coupon-sel").value);
    const final = Math.max(0, rawAmt - disc);
    document.getElementById("pay-amount").innerText = final + "円";
  }

  function finish() { alert("完了！"); location.reload(); }
  function openQRModal() { document.getElementById("qr-modal").style.display = "block"; }
  function closeModal() { document.querySelectorAll(".modal").forEach(m => m.style.display = "none"); }
</script>
</body>
</html>

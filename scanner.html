<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11Pay - フル機能版</title>
  <!-- QRスキャナー用 -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 15px; background-color: #f4f6f9; margin: 0; }
    .container { max-width: 440px; margin: 0 auto; }
    
    .card-box { background: white; padding: 30px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 20px; }
    
    /* タブ切り替えスタイル */
    .tab-container { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
    .tab-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; color: #888; background: none; border: none; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #ff0033; border-bottom-color: #ff0033; }

    .login-title { font-size: 24px; font-weight: bold; color: #ff0033; margin-bottom: 15px; }
    input[type="text"], input[type="password"], input[type="number"] { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #ddd; border-radius: 12px; margin-bottom: 12px; text-align: center; }
    
    .main-btn { width: 100%; padding: 16px; font-size: 18px; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; background: #ff0033; }
    .send-qr-btn { width: 100%; padding: 14px; font-size: 16px; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; background: #007bff; margin-bottom: 10px; }
    .scratch-btn { width: 100%; padding: 14px; font-size: 16px; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; background: #ff9900; margin-bottom: 10px; }
    .game-btn { width: 100%; padding: 14px; font-size: 16px; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; background: #28a745; margin-bottom: 15px; }
    .secondary-btn { width: 100%; padding: 12px; font-size: 15px; color: #666; border: 1px solid #ccc; border-radius: 12px; cursor: pointer; font-weight: bold; background: #fff; margin-top: 8px; }

    .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; margin-bottom: 10px; }
    .user-info { font-size: 16px; font-weight: bold; color: #333; display: flex; align-items: center; gap: 6px; }
    .header-btns { display: flex; gap: 6px; }
    .small-btn { background: #666; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }

    .balance-card { 
      background: linear-gradient(135deg, #ff0033, #ff4d4d); 
      color: white; 
      padding: 25px 20px; 
      border-radius: 20px; 
      box-shadow: 0 6px 18px rgba(255,0,51,0.3); 
      margin-bottom: 15px;
    }
    .card-label { font-size: 15px; opacity: 0.9; margin-bottom: 5px; }
    .card-amount { font-size: 42px; font-weight: bold; }
    .point-display { margin-top: 10px; font-size: 16px; background: rgba(255, 255, 255, 0.2); padding: 6px 12px; border-radius: 20px; display: inline-block; }

    #reader { width: 100%; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px 20px; border-radius: 20px; width: 88%; max-width: 360px; text-align: center; }
    .roulette-box { font-size: 32px; font-weight: bold; color: #ff0033; margin: 20px 0; min-height: 48px; white-space: pre-line; }
    
    /* スクラッチ用スタイル */
    .scratch-container { position: relative; width: 200px; height: 100px; margin: 15px auto; user-select: none; }
    .scratch-result { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; border: 2px dashed #ff9900; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #ff0033; padding: 10px; }
    .scratch-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 10px; cursor: pointer; }

    /* ゲーム用スタイル */
    #game-canvas { background: #222; border-radius: 10px; margin: 10px auto; display: block; touch-action: none; }

    #qr-output-container { display: flex; justify-content: center; margin: 15px 0; }
    #qr-output-container img { width: 200px; height: 200px; border-radius: 10px; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 認証画面 -->
  <div id="auth-view" class="card-box">
    <div class="tab-container">
      <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">ログイン</button>
      <button id="tab-register" class="tab-btn" onclick="switchTab('register')">新規登録</button>
    </div>

    <div id="form-login">
      <div class="login-title">11Pay ログイン</div>
      <input type="text" id="login-user" placeholder="ユーザー名" autocomplete="off">
      <input type="password" id="login-pass" placeholder="パスワード" autocomplete="off">
      <button class="main-btn" onclick="login()">ログイン</button>
    </div>

    <div id="form-register" class="hidden">
      <div class="login-title">アカウントを作成</div>
      <input type="text" id="reg-user" placeholder="新しいユーザー名" autocomplete="off">
      <input type="password" id="reg-pass" placeholder="パスワード" autocomplete="off">
      <input type="password" id="reg-pass-confirm" placeholder="パスワード (確認)" autocomplete="off">
      <button class="main-btn" onclick="register()">新規登録してはじめる</button>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="main-view" class="hidden">
    <div class="header">
      <div class="user-info">👤 <span id="user-display">きらと</span></div>
      <div class="header-btns">
        <button class="small-btn" style="background:#007bff;" onclick="openPassModal()">パスワード変更</button>
        <button class="small-btn" onclick="logout()">ログアウト</button>
      </div>
    </div>

    <div class="balance-card">
      <div class="card-label">11Pay残高</div>
      <div class="card-amount"><span id="balance-display">0</span> 円</div>
      <div class="point-display">🪙 ポイント: <span id="point-display">0</span> pt</div>
    </div>

    <button class="send-qr-btn" onclick="openSendQrModal()">📲 QRコードで送る</button>
    <button class="scratch-btn" onclick="openScratchModal()">🎰 毎日スクラッチくじ</button>
    <button class="game-btn" onclick="openGameModal()">🎮 ブロック崩しで100pt GET</button>

    <div id="reader"></div>
  </div>

</div>

<!-- ゲームモーダル -->
<div id="game-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>🎮 ブロック崩しチャレンジ</h3>
    <p style="font-size: 13px; color: #666; margin-bottom: 5px;">バーを指やマウスで動かしてブロックを壊そう！</p>
    <canvas id="game-canvas" width="200" height="250"></canvas>
    <button class="main-btn hidden" id="game-claim-btn" onclick="claimGamePoints()">100ptを受け取る</button>
    <button class="secondary-btn" id="game-close-btn" onclick="closeGameModal()">閉じる</button>
  </div>
</div>

<!-- スクラッチモーダル -->
<div id="scratch-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>🎰 毎日スクラッチ</h3>
    <p style="font-size: 13px; color: #666; margin-bottom: 10px;">グレーの部分を指やマウスでけずってね！</p>
    
    <div class="scratch-container">
      <div id="scratch-result-text" class="scratch-result">?</div>
      <canvas id="scratch-canvas" class="scratch-canvas" width="200" height="100"></canvas>
    </div>

    <button class="main-btn hidden" id="scratch-claim-btn" onclick="claimScratchPoints()">ポイントを受け取る</button>
    <button class="secondary-btn" id="scratch-close-btn" onclick="closeScratchModal()">閉じる</button>
  </div>
</div>

<!-- パスワード変更モーダル -->
<div id="pass-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>パスワード変更</h3>
    <input type="password" id="old-pass" placeholder="現在のパスワード">
    <input type="password" id="new-pass" placeholder="新しいパスワード">
    <input type="password" id="new-pass-confirm" placeholder="新しいパスワード (確認)">
    <button class="main-btn" onclick="changePassword()">変更する</button>
    <button class="secondary-btn" onclick="closePassModal()">キャンセル</button>
  </div>
</div>

<!-- QRコードで送るモーダル -->
<div id="send-qr-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>QRコードで送る</h3>
    <p style="font-size: 13px; color: #666; margin-bottom: 10px;">送る金額を入力してQRを作成してください</p>
    
    <div id="qr-input-area">
      <input type="number" id="send-qr-amount" placeholder="送金金額 (例: 500)">
      <button class="main-btn" onclick="generateSendQr()">QRコード作成</button>
    </div>

    <div id="qr-result-area" class="hidden">
      <p style="font-weight: bold; margin-bottom: 5px;">相手にカメラで読み取ってもらってください</p>
      <div id="qr-output-container"></div>
      <p style="font-size: 14px; color: #333;" id="qr-desc-amount"></p>
      <button class="secondary-btn" style="color:#ff0033; border-color:#ff0033;" onclick="cancelSendQr()">送金をキャンセルして残高に戻す</button>
    </div>

    <button class="secondary-btn" id="close-qr-btn" onclick="closeSendQrModal()">閉じる</button>
  </div>
</div>

<!-- 決済・ポイント確認モーダル -->
<div id="pay-confirm-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>お支払いの確認</h3>
    <p style="font-size: 18px; font-weight: bold; margin: 10px 0;">請求額: <span id="confirm-pay-amount" style="color:#ff0033;">0</span> 円</p>
    
    <div style="background: #f8f9fa; padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: left;">
      <label style="font-weight: bold; display: block; margin-bottom: 5px;">
        <input type="checkbox" id="use-pt-check" onchange="togglePointInput()"> ポイントを使用する
      </label>
      <div id="pt-input-container" class="hidden">
        <input type="number" id="use-pt-input" placeholder="使用ポイント" style="margin-bottom: 0;">
        <small style="color: #666;">利用可能: <span id="max-pt-display">0</span> pt</small>
        <p style="color: #ff0033; font-size: 11px; margin: 4px 0 0 0;">※ポイント使用時はジャンボ（ルーレット）対象外となります</p>
      </div>
    </div>

    <button class="main-btn" onclick="executePayment()">支払いを確定する</button>
    <button class="secondary-btn" onclick="cancelPayment()">キャンセル</button>
  </div>
</div>

<!-- ルーレット結果モーダル -->
<div id="roulette-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>🎉 11Payジャンボ！</h3>
    <p style="color: #666; font-size: 14px;" id="roulette-sub">ポイント還元率を抽選中...</p>
    <div id="roulette-display" class="roulette-box">🎰 回しています...</div>
    <button id="roulette-close-btn" class="main-btn hidden" onclick="closeRoulette()">ポイントを受け取る</button>
  </div>
</div>

<script>
  let currentUser = localStorage.getItem("paypay_login_user") || "";
  let balance = 0;
  let points = 0;
  
  let currentScanAmount = 0;
  let earnedPoints = 0;
  let pendingSendAmount = 0;
  let html5QrCode;

  // スクラッチ用変数
  let scratchPointResult = 0;
  let scratchIsCleared = false;
  let isDrawing = false;

  // ゲーム用変数
  let gameInterval;
  let gameCanvas, gameCtx;
  let ballX, ballY, ballDX, ballDY;
  let paddleX, paddleWidth = 60, paddleHeight = 10;
  let bricks = [];
  const brickRows = 3, brickCols = 5, brickWidth = 50, brickHeight = 15, brickPadding = 8, brickOffsetTop = 20, brickOffsetLeft = 10;

  function getUsers() {
    const users = localStorage.getItem("paypay_users");
    return users ? JSON.parse(users) : { "きらと": "1234" };
  }

  function saveUsers(users) {
    localStorage.setItem("paypay_users", JSON.stringify(users));
  }

  // --- 音声効果音 ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(type) {
    try {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'beep') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'pay') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'tick') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.03, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'win') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const noteOsc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          noteOsc.connect(noteGain);
          noteGain.connect(audioCtx.destination);
          noteOsc.type = 'sine';
          noteOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
          noteGain.gain.setValueAtTime(0.15, now + idx * 0.1);
          noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.2);
          noteOsc.start(now + idx * 0.1);
          noteOsc.stop(now + idx * 0.1 + 0.2);
        });
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    } catch(e) { console.log(e); }
  }

  window.onload = function() {
    clearAuthFields();
    if (currentUser) {
      showMainScreen();
    }
  };

  function clearAuthFields() {
    document.getElementById("login-user").value = "";
    document.getElementById("login-pass").value = "";
    document.getElementById("reg-user").value = "";
    document.getElementById("reg-pass").value = "";
    document.getElementById("reg-pass-confirm").value = "";
  }

  function switchTab(tab) {
    playSound('beep');
    clearAuthFields();
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const formLogin = document.getElementById("form-login");
    const formRegister = document.getElementById("form-register");

    if (tab === 'login') {
      tabLogin.classList.add("active");
      tabRegister.classList.remove("active");
      formLogin.classList.remove("hidden");
      formRegister.classList.add("hidden");
    } else {
      tabRegister.classList.add("active");
      tabLogin.classList.remove("active");
      formRegister.classList.remove("hidden");
      formLogin.classList.add("hidden");
    }
  }

  function login() {
    playSound('beep');
    const userInput = document.getElementById("login-user").value.trim();
    const passInput = document.getElementById("login-pass").value;

    if (!userInput) return alert("ユーザー名を入力してください");

    const users = getUsers();

    if (!users[userInput] || users[userInput] !== passInput) {
      playSound('error');
      return alert("ユーザー名またはパスワードが間違っています");
    }

    currentUser = userInput;
    localStorage.setItem("paypay_login_user", currentUser);
    showMainScreen();
  }

  function register() {
    playSound('beep');
    const userInput = document.getElementById("reg-user").value.trim();
    const passInput = document.getElementById("reg-pass").value;
    const confirmInput = document.getElementById("reg-pass-confirm").value;

    if (!userInput) return alert("ユーザー名を入力してください");
    if (!passInput) return alert("パスワードを入力してください");
    if (passInput !== confirmInput) {
      playSound('error');
      return alert("パスワードが一致しません");
    }

    const users = getUsers();

    if (users[userInput]) {
      playSound('error');
      return alert("このユーザー名は既に使われています");
    }

    users[userInput] = passInput;
    saveUsers(users);

    localStorage.setItem(`balance_${userInput}`, 1000);
    localStorage.setItem(`points_${userInput}`, 0);

    currentUser = userInput;
    localStorage.setItem("paypay_login_user", currentUser);
    alert("アカウントの作成が完了しました！");
    showMainScreen();
  }

  // --- ゲーム機能（ブロック崩し） ---
  function openGameModal() {
    playSound('beep');
    document.getElementById("game-claim-btn").classList.add("hidden");
    document.getElementById("game-modal").classList.remove("hidden");

    gameCanvas = document.getElementById("game-canvas");
    gameCtx = gameCanvas.getContext("2d");

    ballX = gameCanvas.width / 2;
    ballY = gameCanvas.height - 30;
    ballDX = 2;
    ballDY = -2;
    paddleX = (gameCanvas.width - paddleWidth) / 2;

    for (let c = 0; c < brickCols; c++) {
      bricks[c] = [];
      for (let r = 0; r < brickRows; r++) {
        bricks[c][r] = { x: 0, y: 0, status: 1 };
      }
    }

    function movePaddle(e) {
      const rect = gameCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      paddleX = clientX - rect.left - paddleWidth / 2;
    }

    gameCanvas.onmousemove = movePaddle;
    gameCanvas.ontouchmove = movePaddle;

    clearInterval(gameInterval);
    gameInterval = setInterval(drawGame, 10);
  }

  function drawGame() {
    gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

    // ブロック描画
    let remainingBricks = 0;
    for (let c = 0; c < brickCols; c++) {
      for (let r = 0; r < brickRows; r++) {
        if (bricks[c][r].status === 1) {
          remainingBricks++;
          const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
          const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
          bricks[c][r].x = brickX;
          bricks[c][r].y = brickY;
          gameCtx.fillStyle = "#ff0033";
          gameCtx.fillRect(brickX, brickY, brickWidth, brickHeight);
        }
      }
    }

    // ボール描画
    gameCtx.beginPath();
    gameCtx.arc(ballX, ballY, 6, 0, Math.PI * 2);
    gameCtx.fillStyle = "#fff";
    gameCtx.fill();
    gameCtx.closePath();

    // パドル描画
    gameCtx.fillStyle = "#007bff";
    gameCtx.fillRect(paddleX, gameCanvas.height - paddleHeight, paddleWidth, paddleHeight);

    // ブロック衝突判定
    for (let c = 0; c < brickCols; c++) {
      for (let r = 0; r < brickRows; r++) {
        const b = bricks[c][r];
        if (b.status === 1) {
          if (ballX > b.x && ballX < b.x + brickWidth && ballY > b.y && ballY < b.y + brickHeight) {
            ballDY = -ballDY;
            b.status = 0;
            playSound('tick');
          }
        }
      }
    }

    // 全クリア判定
    if (remainingBricks === 0) {
      clearInterval(gameInterval);
      playSound('win');
      document.getElementById("game-claim-btn").classList.remove("hidden");
      return;
    }

    // 壁反射判定
    if (ballX + ballDX > gameCanvas.width - 6 || ballX + ballDX < 6) ballDX = -ballDX;
    if (ballY + ballDY < 6) ballDY = -ballDY;
    else if (ballY + ballDY > gameCanvas.height - 6) {
      if (ballX > paddleX && ballX < paddleX + paddleWidth) {
        ballDY = -ballDY;
        playSound('beep');
      } else {
        clearInterval(gameInterval);
        playSound('error');
        alert("ゲームオーバー！もう一度挑戦してね");
        closeGameModal();
        return;
      }
    }

    ballX += ballDX;
    ballY += ballDY;
  }

  function claimGamePoints() {
    playSound('beep');
    points += 100;
    updateDisplay();
    alert("🎉 ゲームクリア！ 100ポイントを獲得しました！");
    closeGameModal();
  }

  function closeGameModal() {
    playSound('beep');
    clearInterval(gameInterval);
    document.getElementById("game-modal").classList.add("hidden");
  }

  // --- スクラッチ機能 ---
  function openScratchModal(){
    playSound('beep');
    const today = new Date().toLocaleDateString();
    const lastScratchDate = localStorage.getItem(`scratch_date_${currentUser}`);

    if (lastScratchDate === today) {
      playSound('error');
      return alert("今日のスクラッチはすでに引いています！\nまた明日チャレンジしてね！");
    }

    const rand = Math.random() * 100;
    if (rand < 2) scratchPointResult = 1000;
    else if (rand < 10) scratchPointResult = 500;
    else if (rand < 30) scratchPointResult = 100;
    else scratchPointResult = 50;

    document.getElementById("scratch-result-text").innerText = `${scratchPointResult}ポイント\nプレゼント！`;
    document.getElementById("scratch-claim-btn").classList.add("hidden");
    document.getElementById("scratch-modal").classList.remove("hidden");

    initScratchCanvas();
  }

  function initScratchCanvas() {
    const canvas = document.getElementById("scratch-canvas");
    const ctx = canvas.getContext("2d");
    scratchIsCleared = false;

    ctx.fillStyle = "#cccccc";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = "bold 16px sans-serif";
    ctx.fillStyle = "#666666";
    ctx.textAlign = "center";
    ctx.fillText("ここを擦ってね！", canvas.width / 2, canvas.height / 2 + 5);

    function scratch(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      const x = touch.clientX - rect.left;
      const y = touch.clientY - rect.top;

      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(x, y, 15, 0, Math.PI * 2);
      ctx.fill();

      checkScratchProgress(ctx, canvas);
    }

    canvas.onmousedown = (e) => { isDrawing = true; scratch(e); };
    canvas.onmousemove = scratch;
    canvas.onmouseup = () => { isDrawing = false; };
    canvas.ontouchstart = (e) => { isDrawing = true; scratch(e); };
    canvas.ontouchmove = scratch;
    canvas.ontouchend = () => { isDrawing = false; };
  }

  function checkScratchProgress(ctx, canvas) {
    if (scratchIsCleared) return;

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let transparentPixels = 0;
    for (let i = 3; i < imgData.data.length; i += 4) {
      if (imgData.data[i] === 0) transparentPixels++;
    }

    if (transparentPixels > imgData.data.length / 4 * 0.4) {
      scratchIsCleared = true;
      playSound('win');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      document.getElementById("scratch-claim-btn").classList.remove("hidden");
    }
  }

  function claimScratchPoints() {
    playSound('beep');
    const today = new Date().toLocaleDateString();
    localStorage.setItem(`scratch_date_${currentUser}`, today);

    points += scratchPointResult;
    updateDisplay();

    alert(`🎉 ${scratchPointResult} ポイントを獲得しました！`);
    closeScratchModal();
  }

  function closeScratchModal() {
    playSound('beep');
    document.getElementById("scratch-modal").classList.add("hidden");
  }

  // --- パスワード変更機能 ---
  function openPassModal() {
    playSound('beep');
    document.getElementById("old-pass").value = "";
    document.getElementById("new-pass").value = "";
    document.getElementById("new-pass-confirm").value = "";
    document.getElementById("pass-modal").classList.remove("hidden");
  }

  function closePassModal() {
    playSound('beep');
    document.getElementById("pass-modal").classList.add("hidden");
  }

  function changePassword() {
    const oldPass = document.getElementById("old-pass").value;
    const newPass = document.getElementById("new-pass").value;
    const newPassConfirm = document.getElementById("new-pass-confirm").value;

    const users = getUsers();

    if (users[currentUser] !== oldPass) {
      playSound('error');
      return alert("現在のパスワードが違います");
    }

    if (!newPass) {
      playSound('error');
      return alert("新しいパスワードを入力してください");
    }

    if (newPass !== newPassConfirm) {
      playSound('error');
      return alert("新しいパスワード（確認）が一致しません");
    }

    users[currentUser] = newPass;
    saveUsers(users);

    playSound('win');
    alert("パスワードを変更しました！");
    closePassModal();
  }

  function logout() {
    playSound('beep');
    const doLogout = () => {
      localStorage.removeItem("paypay_login_user");
      clearAuthFields();
      location.reload();
    };
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(doLogout).catch(doLogout);
    } else {
      doLogout();
    }
  }

  function showMainScreen() {
    document.getElementById("auth-view").classList.add("hidden");
    document.getElementById("main-view").classList.remove("hidden");
    document.getElementById("user-display").innerText = currentUser;

    const savedBalance = localStorage.getItem(`balance_${currentUser}`);
    balance = (savedBalance !== null) ? parseInt(savedBalance) : 1000;

    const savedPoints = localStorage.getItem(`points_${currentUser}`);
    points = (savedPoints !== null) ? parseInt(savedPoints) : 0;
    
    updateDisplay();
    startScanner();
  }

  function updateDisplay() {
    document.getElementById("balance-display").innerText = balance.toLocaleString();
    document.getElementById("point-display").innerText = points.toLocaleString();
    localStorage.setItem(`balance_${currentUser}`, balance);
    localStorage.setItem(`points_${currentUser}`, points);
  }

  // --- 送金用QRコード機能 ---
  function openSendQrModal() {
    playSound('beep');
    document.getElementById("send-qr-amount").value = "";
    document.getElementById("qr-input-area").classList.remove("hidden");
    document.getElementById("qr-result-area").classList.add("hidden");
    document.getElementById("qr-output-container").innerHTML = "";
    document.getElementById("send-qr-modal").classList.remove("hidden");
  }

  function closeSendQrModal() {
    playSound('beep');
    pendingSendAmount = 0;
    document.getElementById("send-qr-modal").classList.add("hidden");
  }

  function generateSendQr() {
    const sendAmount = parseInt(document.getElementById("send-qr-amount").value);

    if (isNaN(sendAmount) || sendAmount <= 0) {
      playSound('error');
      return alert("正しい送金金額を入力してください");
    }

    if (sendAmount > balance) {
      playSound('error');
      return alert(`残高が不足しています！\n現在の残高: ${balance.toLocaleString()}円`);
    }

    pendingSendAmount = sendAmount;
    balance -= sendAmount;
    updateDisplay();

    const qrData = `SEND:${currentUser}:${sendAmount}`;
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}`;
    
    const container = document.getElementById("qr-output-container");
    container.innerHTML = `<img src="${qrUrl}" alt="送金QRコード">`;

    document.getElementById("qr-desc-amount").innerText = `送金額: ${sendAmount.toLocaleString()}円`;
    document.getElementById("qr-input-area").classList.add("hidden");
    document.getElementById("qr-result-area").classList.remove("hidden");
    playSound('pay');
  }

  function cancelSendQr() {
    if (pendingSendAmount > 0) {
      balance += pendingSendAmount;
      updateDisplay();
      pendingSendAmount = 0;
      playSound('win');
      alert("送金をキャンセルし、残高を戻しました。");
    }
    closeSendQrModal();
  }

  // --- スキャナー処理 ---
  function startScanner() {
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    ).catch(err => {
      console.log("カメラ起動エラー: ", err);
    });
  }

  function onScanSuccess(decodedText) {
    html5QrCode.stop();
    playSound('beep');

    if (decodedText.startsWith("SEND:")) {
      const parts = decodedText.split(":");
      const senderUser = parts[1];
      const sendAmount = parseInt(parts[2]) || 0;

      if (senderUser === currentUser) {
        playSound('error');
        alert("自分の送金用QRコードは読み込めません");
        location.reload();
        return;
      }

      balance += sendAmount;
      updateDisplay();

      playSound('win');
      alert(`🎁 ${senderUser} 様より ${sendAmount.toLocaleString()}円 を受取りました！`);
      location.reload();
      return;
    }

    const isCharge = decodedText.startsWith("CHARGE_");
    const amount = parseInt(decodedText.replace(/(CHARGE_|PAY_)/, "")) || 0;

    if (isCharge) {
      balance += amount;
      updateDisplay();
      playSound('win');
      alert(`✅ ${amount.toLocaleString()}円 チャージが完了しました！`);
      location.reload();
    } else {
      currentScanAmount = amount;
      openPayConfirmModal();
    }
  }

  function openPayConfirmModal() {
    document.getElementById("confirm-pay-amount").innerText = currentScanAmount.toLocaleString();
    document.getElementById("max-pt-display").innerText = points.toLocaleString();
    document.getElementById("use-pt-check").checked = false;
    document.getElementById("use-pt-input").value = "";
    togglePointInput();
    document.getElementById("pay-confirm-modal").classList.remove("hidden");
  }

  function togglePointInput() {
    playSound('beep');
    const isChecked = document.getElementById("use-pt-check").checked;
    document.getElementById("pt-input-container").classList.toggle("hidden", !isChecked);
  }

  function cancelPayment() {
    playSound('beep');
    document.getElementById("pay-confirm-modal").classList.add("hidden");
    location.reload();
  }

  function executePayment() {
    const usePtChecked = document.getElementById("use-pt-check").checked;
    let usePt = parseInt(document.getElementById("use-pt-input").value) || 0;

    if (usePtChecked) {
      if (usePt <= 0) return alert("利用するポイントを入力してください");
      if (usePt > points) {
        playSound('error');
        return alert("保持ポイントを超えています");
      }
      if (usePt > currentScanAmount) usePt = currentScanAmount;
    } else {
      usePt = 0;
    }

    const cashPay = currentScanAmount - usePt;

    if (cashPay > balance) {
      playSound('error');
      alert(`❌ 残高が不足しています！\n現金必要額: ${cashPay}円 / 残高: ${balance}円`);
      return;
    }

    playSound('pay');

    balance -= cashPay;
    points -= usePt;
    updateDisplay();

    document.getElementById("pay-confirm-modal").classList.add("hidden");

    if (usePt > 0) {
      alert(`✅ お支払い完了！\n(ポイント利用のためルーレットはスキップされました)`);
      location.reload();
    } else {
      startRoulette(currentScanAmount);
    }
  }

  function startRoulette(payAmount) {
    document.getElementById("roulette-modal").classList.remove("hidden");
    document.getElementById("roulette-close-btn").classList.add("hidden");
    document.getElementById("roulette-sub").innerText = "ポイント還元率を抽選中...";

    let count = 0;
    const rates = [0.01, 0.05, 0.1, 0.5, 1.0];

    const interval = setInterval(() => {
      playSound('tick');
      const randomRate = rates[Math.floor(Math.random() * rates.length)];
      document.getElementById("roulette-display").innerText = `${Math.round(randomRate * 100)}% 還元！`;
      count++;

      if (count > 20) {
        clearInterval(interval);
        const finalRate = rates[Math.floor(Math.random() * rates.length)];
        earnedPoints = Math.floor(payAmount * finalRate);
        if (earnedPoints < 1) earnedPoints = 1;

        playSound('win');
        document.getElementById("roulette-sub").innerText = "獲得ポイント決定！";
        document.getElementById("roulette-display").innerText = `🎯 ${Math.round(finalRate * 100)}% 還元!\n(+${earnedPoints}pt)`;
        document.getElementById("roulette-close-btn").classList.remove("hidden");
      }
    }, 100);
  }

  function closeRoulette() {
    playSound('beep');
    points += earnedPoints;
    updateDisplay();
    document.getElementById("roulette-modal").classList.add("hidden");
    location.reload();
  }
</script>

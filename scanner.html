<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11Pay - フル機能版</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 15px; background-color: #f4f6f9; margin: 0; }
    .container { max-width: 440px; margin: 0 auto; }
    
    .card-box { background: white; padding: 30px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 20px; }
    
    .login-title { font-size: 28px; font-weight: bold; color: #ff0033; margin-bottom: 20px; }
    input[type="text"], input[type="password"], input[type="number"] { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #ddd; border-radius: 12px; margin-bottom: 12px; text-align: center; }
    
    .main-btn { width: 100%; padding: 16px; font-size: 18px; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; background: #ff0033; }
    .secondary-btn { width: 100%; padding: 12px; font-size: 15px; color: #666; border: 1px solid #ccc; border-radius: 12px; cursor: pointer; font-weight: bold; background: #fff; margin-top: 8px; }

    .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; margin-bottom: 10px; }
    .user-info { font-size: 18px; font-weight: bold; color: #333; display: flex; align-items: center; gap: 6px; }
    .logout-btn { background: #666; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .balance-card { 
      background: linear-gradient(135deg, #ff0033, #ff4d4d); 
      color: white; 
      padding: 25px 20px; 
      border-radius: 20px; 
      box-shadow: 0 6px 18px rgba(255,0,51,0.3); 
      margin-bottom: 20px;
    }
    .card-label { font-size: 15px; opacity: 0.9; margin-bottom: 5px; }
    .card-amount { font-size: 42px; font-weight: bold; }
    .point-display { margin-top: 10px; font-size: 16px; background: rgba(255, 255, 255, 0.2); padding: 6px 12px; border-radius: 20px; display: inline-block; }

    #reader { width: 100%; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px 20px; border-radius: 20px; width: 88%; max-width: 360px; text-align: center; }
    .roulette-box { font-size: 32px; font-weight: bold; color: #ff0033; margin: 20px 0; min-height: 48px; white-space: pre-line; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- ログイン画面 -->
  <div id="login-view" class="card-box">
    <div class="login-title">11Pay ログイン</div>
    <input type="text" id="login-user" placeholder="ユーザー名" value="きらと">
    <input type="password" id="login-pass" placeholder="パスワード (初期: 1234)" value="1234">
    <button class="main-btn" onclick="login()">ログイン</button>
  </div>

  <!-- メイン画面 -->
  <div id="main-view" class="hidden">
    <div class="header">
      <div class="user-info">👤 <span id="user-display">きらと</span></div>
      <button class="logout-btn" onclick="logout()">ログアウト</button>
    </div>

    <div class="balance-card">
      <div class="card-label">11Pay残高</div>
      <div class="card-amount"><span id="balance-display">0</span> 円</div>
      <div class="point-display">🪙 ポイント: <span id="point-display">0</span> pt</div>
    </div>

    <div id="reader"></div>
  </div>

</div>

<!-- 決済・ポイント確認モーダル -->
<div id="pay-confirm-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>お支払いの確認</h3>
    <p style="font-size: 18px; font-weight: bold; margin: 10px 0;">請求額: <span id="confirm-pay-amount" style="color:#ff0033;">0</span> 円</p>
    
    <div style="background: #f8f9fa; padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: left;">
      <label style="font-weight: bold; display: block; margin-bottom: 5px;">
        <input type="checkbox" id="use-pt-check" onchange="togglePointInput()"> ポイントを使用する
      </label>
      <div id="pt-input-container" class="hidden">
        <input type="number" id="use-pt-input" placeholder="使用ポイント" style="margin-bottom: 0;">
        <small style="color: #666;">利用可能: <span id="max-pt-display">0</span> pt</small>
        <p style="color: #ff0033; font-size: 11px; margin: 4px 0 0 0;">※ポイント使用時はジャンボ（ルーレット）対象外となります</p>
      </div>
    </div>

    <button class="main-btn" onclick="executePayment()">支払いを確定する</button>
    <button class="secondary-btn" onclick="cancelPayment()">キャンセル</button>
  </div>
</div>

<!-- ルーレット結果モーダル -->
<div id="roulette-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>🎉 11Payジャンボ！</h3>
    <p style="color: #666; font-size: 14px;" id="roulette-sub">ポイント還元率を抽選中...</p>
    <div id="roulette-display" class="roulette-box">🎰 回しています...</div>
    <button id="roulette-close-btn" class="main-btn hidden" onclick="closeRoulette()">ポイントを受け取る</button>
  </div>
</div>

<script>
  let currentUser = localStorage.getItem("paypay_login_user") || "";
  let balance = 0;
  let points = 0;
  
  let currentScanAmount = 0;
  let earnedPoints = 0;
  let html5QrCode;

  // --- 音声効果音 (Web Audio API) ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(type) {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'beep') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'pay') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.12);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (type === 'tick') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(400, now);
      gain.gain.setValueAtTime(0.03, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'win') {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const noteOsc = audioCtx.createOscillator();
        const noteGain = audioCtx.createGain();
        noteOsc.connect(noteGain);
        noteGain.connect(audioCtx.destination);
        noteOsc.type = 'sine';
        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
        noteGain.gain.setValueAtTime(0.15, now + idx * 0.1);
        noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.2);
        noteOsc.start(now + idx * 0.1);
        noteOsc.stop(now + idx * 0.1 + 0.2);
      });
    } else if (type === 'error') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    }
  }

  window.onload = function() {
    if (currentUser) {
      showMainScreen();
    }
  };

  function login() {
    playSound('beep');
    const userInput = document.getElementById("login-user").value.trim();
    const passInput = document.getElementById("login-pass").value;

    if (!userInput) return alert("ユーザー名を入力してください");
    if (passInput !== "1234") {
      playSound('error');
      return alert("パスワードが間違っています");
    }

    currentUser = userInput;
    localStorage.setItem("paypay_login_user", currentUser);
    showMainScreen();
  }

  function logout() {
    playSound('beep');
    const doLogout = () => {
      localStorage.removeItem("paypay_login_user");
      location.reload();
    };
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(doLogout).catch(doLogout);
    } else {
      doLogout();
    }
  }

  function showMainScreen() {
    document.getElementById("login-view").classList.add("hidden");
    document.getElementById("main-view").classList.remove("hidden");
    document.getElementById("user-display").innerText = currentUser;

    // ★修正ポイント: データが存在するか（!== null）を正確に判定して取得する
    const savedBalance = localStorage.getItem(`balance_${currentUser}`);
    balance = (savedBalance !== null) ? parseInt(savedBalance) : 1000;

    const savedPoints = localStorage.getItem(`points_${currentUser}`);
    points = (savedPoints !== null) ? parseInt(savedPoints) : 0;
    
    updateDisplay();
    startScanner();
  }

  function updateDisplay() {
    document.getElementById("balance-display").innerText = balance.toLocaleString();
    document.getElementById("point-display").innerText = points.toLocaleString();
    localStorage.setItem(`balance_${currentUser}`, balance);
    localStorage.setItem(`points_${currentUser}`, points);
  }

  function startScanner() {
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    );
  }

  function onScanSuccess(decodedText) {
    html5QrCode.stop();
    playSound('beep');

    const isCharge = decodedText.startsWith("CHARGE_");
    const amount = parseInt(decodedText.replace(/(CHARGE_|PAY_)/, "")) || 0;

    if (isCharge) {
      balance += amount;
      updateDisplay();
      playSound('win');
      alert(`✅ ${amount.toLocaleString()}円 チャージが完了しました！`);
      location.reload();
    } else {
      currentScanAmount = amount;
      openPayConfirmModal();
    }
  }

  function openPayConfirmModal() {
    document.getElementById("confirm-pay-amount").innerText = currentScanAmount.toLocaleString();
    document.getElementById("max-pt-display").innerText = points.toLocaleString();
    document.getElementById("use-pt-check").checked = false;
    document.getElementById("use-pt-input").value = "";
    togglePointInput();
    document.getElementById("pay-confirm-modal").classList.remove("hidden");
  }

  function togglePointInput() {
    playSound('beep');
    const isChecked = document.getElementById("use-pt-check").checked;
    document.getElementById("pt-input-container").classList.toggle("hidden", !isChecked);
  }

  function cancelPayment() {
    playSound('beep');
    document.getElementById("pay-confirm-modal").classList.add("hidden");
    location.reload();
  }

  function executePayment() {
    const usePtChecked = document.getElementById("use-pt-check").checked;
    let usePt = parseInt(document.getElementById("use-pt-input").value) || 0;

    if (usePtChecked) {
      if (usePt <= 0) return alert("利用するポイントを入力してください");
      if (usePt > points) {
        playSound('error');
        return alert("保持ポイントを超えています");
      }
      if (usePt > currentScanAmount) usePt = currentScanAmount;
    } else {
      usePt = 0;
    }

    const cashPay = currentScanAmount - usePt;

    if (cashPay > balance) {
      playSound('error');
      alert(`❌ 残高が不足しています！\n現金必要額: ${cashPay}円 / 残高: ${balance}円`);
      return;
    }

    playSound('pay');

    balance -= cashPay;
    points -= usePt;
    updateDisplay();

    document.getElementById("pay-confirm-modal").classList.add("hidden");

    if (usePt > 0) {
      alert(`✅ お支払い完了！\n(ポイント利用のためルーレットはスキップされました)`);
      location.reload();
    } else {
      startRoulette(currentScanAmount);
    }
  }

  function startRoulette(payAmount) {
    document.getElementById("roulette-modal").classList.remove("hidden");
    document.getElementById("roulette-close-btn").classList.add("hidden");
    document.getElementById("roulette-sub").innerText = "ポイント還元率を抽選中...";

    let count = 0;
    const rates = [0.01, 0.05, 0.1, 0.5, 1.0];

    const interval = setInterval(() => {
      playSound('tick');
      const randomRate = rates[Math.floor(Math.random() * rates.length)];
      document.getElementById("roulette-display").innerText = `${Math.round(randomRate * 100)}% 還元！`;
      count++;

      if (count > 20) {
        clearInterval(interval);
        const finalRate = rates[Math.floor(Math.random() * rates.length)];
        earnedPoints = Math.floor(payAmount * finalRate);
        if (earnedPoints < 1) earnedPoints = 1;

        playSound('win');
        document.getElementById("roulette-sub").innerText = "獲得ポイント決定！";
        document.getElementById("roulette-display").innerText = `🎯 ${Math.round(finalRate * 100)}% 還元!\n(+${earnedPoints}pt)`;
        document.getElementById("roulette-close-btn").classList.remove("hidden");
      }
    }, 100);
  }

  function closeRoulette() {
    playSound('beep');
    points += earnedPoints;
    updateDisplay();
    document.getElementById("roulette-modal").classList.add("hidden");
    location.reload();
  }
</script>

</body>
</html>

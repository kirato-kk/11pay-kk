<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11Pay - Complete Edition</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main-color: #ff0033; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 0; }
        .app-container { max-width: 500px; margin: 0 auto; padding: 20px; }
        
        .auth-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; margin-top: 50px; }
        .auth-input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .auth-toggle { color: var(--main-color); cursor: pointer; font-size: 14px; margin-top: 15px; text-decoration: underline; }

        .card-balance { background: linear-gradient(135deg, var(--main-color), #ff4d4d); color: white; padding: 25px; border-radius: 20px; text-align: center; box-shadow: 0 10px 20px rgba(255,0,51,0.2); margin-bottom: 20px; }
        .amount { font-size: 36px; font-weight: bold; }
        .points-box { background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px; display: inline-block; margin-top: 10px; font-weight: bold; }
        
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 12px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; background: white; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--main-color); color: white; }
        .btn-logout { background: #666; color: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; border: none; cursor: pointer; }
        
        #reader { background: white; border-radius: 20px; overflow: hidden; border: 2px solid #ddd; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 25px; border-radius: 20px; text-align: center; position: relative; }
        
        .coupon-item { border: 1px dashed var(--main-color); background: #fff0f2; padding: 12px; border-radius: 10px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .coupon-btn { background: var(--main-color); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .roulette-display { font-size: 40px; font-weight: bold; color: var(--main-color); margin: 20px 0; height: 50px; line-height: 50px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- Auth Section -->
    <div id="section-auth" class="auth-card">
        <h2 id="auth-title" style="color:var(--main-color);">11Pay ログイン</h2>
        <input type="text" id="auth-user" class="auth-input" placeholder="ユーザー名">
        <input type="password" id="auth-pass" class="auth-input" placeholder="パスワード">
        <button class="btn btn-primary" style="width:100%; margin-top:10px;" id="auth-submit-btn" onclick="handleAuth()">ログイン</button>
        <div class="auth-toggle" id="auth-toggle-btn" onclick="toggleAuthMode()">新規登録はこちら</div>
    </div>

    <!-- Main App Section -->
    <div id="section-main" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3>👤 <span id="display-username"></span></h3>
            <button class="btn-logout" onclick="logout()">ログアウト</button>
        </div>

        <div class="card-balance">
            <div>11Pay残高</div>
            <div class="amount" id="display-balance">0</div>
            <div class="points-box" id="display-points">🪙 0 pt</div>
        </div>

        <div class="actions">
            <button class="btn" onclick="openModal('modal-qr')">受取QR生成</button>
            <button class="btn" onclick="openModal('modal-coupon')">ポイント交換</button>
        </div>

        <div id="reader"></div>
    </div>

</div>

<!-- Auto Payment Roulette Modal -->
<div id="modal-roulette" class="modal">
    <div class="modal-content">
        <h3>🎉 決済完了還元ルーレット</h3>
        <p style="font-size:13px; color:#666;">お会計ごとに1〜100%のポイント還元！</p>
        <div class="roulette-display" id="roulette-percent">0 %</div>
        <div style="font-size:18px; font-weight:bold; color:#333;" id="roulette-result-pt">0 pt 獲得</div>
        <button class="btn btn-primary" id="roulette-close-btn" style="width:100%; margin-top:20px; display:none;" onclick="finishPaymentProcess()">OK</button>
    </div>
</div>

<!-- QR Generator Modal -->
<div id="modal-qr" class="modal">
    <div class="modal-content">
        <h3>受取金額を入力</h3>
        <input type="number" id="gen-amount" class="auth-input" placeholder="金額 (例: 500)">
        <button class="btn btn-primary" style="width:100%;" onclick="generateQR()">QR生成</button>
        <div id="qrcode-area" style="margin-top:15px; display:flex; justify-content:center;"></div>
        <button class="btn" style="width:100%; margin-top:15px;" onclick="closeModals()">閉じる</button>
    </div>
</div>

<!-- Coupon Exchange Modal -->
<div id="modal-coupon" class="modal">
    <div class="modal-content">
        <h3>クーポンポイント交換</h3>
        <p style="font-size:12px; color:#666;">保有: <span id="exchange-current-pt">0</span> pt</p>
        
        <div class="coupon-item">
            <div style="text-align:left;">
                <strong style="color:var(--main-color);">2,000円引き</strong><br>
                <small>必要: 1,000 pt</small>
            </div>
            <button class="coupon-btn" onclick="exchangeCoupon(1000, 2000)">交換</button>
        </div>

        <div class="coupon-item">
            <div style="text-align:left;">
                <strong style="color:var(--main-color);">7,000円引き</strong><br>
                <small>必要: 5,000 pt</small>
            </div>
            <button class="coupon-btn" onclick="exchangeCoupon(5000, 7000)">交換</button>
        </div>

        <div class="coupon-item">
            <div style="text-align:left;">
                <strong style="color:var(--main-color);">20,000円引き</strong><br>
                <small>必要: 10,000 pt</small>
            </div>
            <button class="coupon-btn" onclick="exchangeCoupon(10000, 20000)">交換</button>
        </div>

        <div style="margin-top:15px; text-align:left;">
            <label style="font-size:13px;">保有クーポン選択:</label>
            <select id="active-coupons" class="auth-input">
                <option value="0">使用するクーポンを選択</option>
            </select>
        </div>

        <button class="btn" style="width:100%; margin-top:10px;" onclick="closeModals()">完了</button>
    </div>
</div>

<!-- Payment Modal -->
<div id="modal-pay" class="modal">
    <div class="modal-content">
        <h2>お支払い確認</h2>
        <div style="font-size:28px; color:var(--main-color); font-weight:bold; margin:15px 0;" id="pay-amount-display">0円</div>
        <div id="pay-coupon-info" style="font-size:13px; color:#666; margin-bottom:10px;"></div>
        
        <div style="text-align:left; margin-bottom:15px;">
            <label style="font-size:13px; font-weight:bold;">支払い方法:</label>
            <select id="pay-method" class="auth-input">
                <option value="balance">11Pay残高で支払う</option>
                <option value="points">ポイントで支払う (1pt = 1円)</option>
            </select>
        </div>

        <button class="btn btn-primary" style="width:100%; font-size:18px;" onclick="confirmPayment()">確定する</button>
        <button class="btn" style="width:100%; margin-top:8px;" onclick="closeModals()">キャンセル</button>
    </div>
</div>

<script>
    let isRegisterMode = false;
    let currentUser = localStorage.getItem('11pay_session') || null;
    let currentScanAmount = 0;
    let scanner = null;

    // --- 音声処理 (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'tick') {
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.02);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
            osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        } else if (type === 'pay') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(987.77, audioCtx.currentTime);
            osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }
    }

    // --- 認証 ---
    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('auth-title').innerText = isRegisterMode ? "11Pay 新規登録" : "11Pay ログイン";
        document.getElementById('auth-submit-btn').innerText = isRegisterMode ? "登録する" : "ログイン";
        document.getElementById('auth-toggle-btn').innerText = isRegisterMode ? "ログインはこちら" : "新規登録はこちら";
    }

    function handleAuth() {
        const user = document.getElementById('auth-user').value.trim();
        const pass = document.getElementById('auth-pass').value.trim();
        if (!user || !pass) return alert("入力してください");

        let userData = JSON.parse(localStorage.getItem(`user_${user}`));

        if (isRegisterMode) {
            if (userData) return alert("既に存在するユーザーです");
            userData = { pass: pass, balance: 5000, points: 2000, coupons: [] };
            localStorage.setItem(`user_${user}`, JSON.stringify(userData));
            alert("登録完了！");
        } else {
            if (!userData || userData.pass !== pass) return alert("認証エラーです");
        }

        currentUser = user;
        localStorage.setItem('11pay_session', currentUser);
        initApp();
    }

    function logout() {
        if (scanner) scanner.stop();
        localStorage.removeItem('11pay_session');
        location.reload();
    }

    function getUserData() {
        return JSON.parse(localStorage.getItem(`user_${currentUser}`)) || { balance: 0, points: 0, coupons: [] };
    }

    function saveUserData(data) {
        localStorage.setItem(`user_${currentUser}`, JSON.stringify(data));
        updateUI();
    }

    function initApp() {
        document.getElementById('section-auth').classList.add('hidden');
        document.getElementById('section-main').classList.remove('hidden');
        document.getElementById('display-username').innerText = currentUser;

        updateUI();

        scanner = new Html5Qrcode("reader");
        scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, onScanSuccess);
    }

    function updateUI() {
        const data = getUserData();
        document.getElementById('display-balance').innerText = `${data.balance.toLocaleString()} 円`;
        document.getElementById('display-points').innerText = `🪙 ${data.points.toLocaleString()} pt`;
        document.getElementById('exchange-current-pt').innerText = data.points.toLocaleString();

        const couponSelect = document.getElementById('active-coupons');
        couponSelect.innerHTML = '<option value="0">使用するクーポンを選択</option>';
        data.coupons.forEach((val) => {
            couponSelect.innerHTML += `<option value="${val}">${val.toLocaleString()}円引きクーポン</option>`;
        });
    }

    // --- クーポン交換 ---
    function exchangeCoupon(costPt, discountVal) {
        let data = getUserData();
        if (data.points < costPt) return alert("ポイントが足りません！");

        data.points -= costPt;
        data.coupons.push(discountVal);
        saveUserData(data);
        playSound('win');
        confetti({ particleCount: 50, spread: 60 });
        alert(`${discountVal.toLocaleString()}円引きクーポン獲得！`);
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

    function generateQR() {
        const amt = document.getElementById('gen-amount').value;
        const area = document.getElementById('qrcode-area');
        if (!amt) return alert("金額を入力してください");
        area.innerHTML = "";
        new QRCode(area, { text: `PAY_${currentUser}_${amt}`, width: 180, height: 180 });
    }

    function onScanSuccess(decodedText) {
        const parts = decodedText.split('_');
        currentScanAmount = parseInt(parts[2] || parts[1] || 0);

        const couponVal = parseInt(document.getElementById('active-coupons').value) || 0;
        const finalAmount = Math.max(0, currentScanAmount - couponVal);

        document.getElementById('pay-amount-display').innerText = `${finalAmount.toLocaleString()} 円`;
        document.getElementById('pay-coupon-info').innerText = couponVal > 0 ? `(クーポン割引: -${couponVal.toLocaleString()}円)` : "クーポン使用なし";
        openModal('modal-pay');
    }

    // --- 決済実行 & 1〜100%還元ルーレット ---
    function confirmPayment() {
        let data = getUserData();
        const couponVal = parseInt(document.getElementById('active-coupons').value) || 0;
        const finalPrice = Math.max(0, currentScanAmount - couponVal);
        const method = document.getElementById('pay-method').value;

        if (method === 'balance') {
            if (data.balance < finalPrice) return alert("11Pay残高が不足しています！");
            data.balance -= finalPrice;
        } else if (method === 'points') {
            if (data.points < finalPrice) return alert("ポイントが不足しています！");
            data.points -= finalPrice;
        }

        // クーポン消化
        if (couponVal > 0) {
            const index = data.coupons.indexOf(couponVal);
            if (index > -1) data.coupons.splice(index, 1);
        }

        saveUserData(data);
        closeModals();
        playSound('pay');

        // クーポン使用時またはポイント支払いの場合はルーレットをスキップ
        if (couponVal > 0 || method === 'points') {
            alert("お支払いが完了しました！ (※クーポン・ポイント利用時はルーレット対象外です)");
            location.reload();
        } else {
            // 還元ルーレット開始
            runPaymentRoulette(finalPrice);
        }
    }

    function runPaymentRoulette(baseAmount) {
        openModal('modal-roulette');
        const closeBtn = document.getElementById('roulette-close-btn');
        closeBtn.style.display = 'none';

        let count = 0;
        const maxCount = 25;

        const timer = setInterval(() => {
            const tempPercent = Math.floor(Math.random() * 100) + 1;
            document.getElementById('roulette-percent').innerText = `${tempPercent} %`;
            document.getElementById('roulette-result-pt').innerText = `${Math.floor(baseAmount * (tempPercent / 100))} pt 獲得`;
            playSound('tick');
            count++;

            if (count >= maxCount) {
                clearInterval(timer);

                // 還元率確定 (1〜100%)
                const finalPercent = Math.floor(Math.random() * 100) + 1;
                const earnedPoints = Math.floor(baseAmount * (finalPercent / 100));

                document.getElementById('roulette-percent').innerText = `${finalPercent} %`;
                document.getElementById('roulette-result-pt').innerText = `+${earnedPoints} pt 獲得！`;

                // ポイント保存
                let data = getUserData();
                data.points += earnedPoints;
                saveUserData(data);

                // 演出
                playSound('win');
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                closeBtn.style.display = 'block';
            }
        }, 80);
    }

    function finishPaymentProcess() {
        closeModals();
        location.reload();
    }

    if (currentUser) initApp();
</script>
</body>
</html>
